{% extends "base.html" %}
{% set page_title = "Change password" %}
{% block crumb %}My account{% endblock %}
{% block content %}
<div class="panel"><div class="panel-body">
<form method="post" class="form">
  <label class="full">Current password<input type="password" name="old_password" required autocomplete="current-password"></label>
  <label>New password<input type="password" name="new_password" required autocomplete="new-password">
    <span class="hint">At least 8 characters, letters and numbers.</span></label>
  <label>Repeat new password<input type="password" name="new_password2" required autocomplete="new-password"></label>
  <div class="form-actions"><button>Change password</button>
    <a class="btn btn-light" href="{{ url_for('reports.dashboard') }}">Cancel</a></div>
</form>
</div></div>
{% endblock %}
