{% extends "base.html" %}
{% set page_title = "New user" %}
{% block crumb %}Administration / Users{% endblock %}
{% block content %}
<div class="panel"><div class="panel-body">
<form method="post" class="form" autocomplete="off">
  <label>Username<input name="username" required value="{{ form.username or '' }}"></label>
  <label>Full name<input name="full_name" required value="{{ form.full_name or '' }}"></label>
  <label>Role
    <select name="role" required>
      {% for r in roles %}<option {% if form.role == r %}selected{% endif %}>{{ r }}</option>{% endfor %}
    </select>
  </label>
  <label>Password<input type="password" name="password" required autocomplete="new-password">
    <span class="hint">At least 8 characters, letters and numbers.</span></label>
  <div class="form-actions"><button>Create user</button>
    <a class="btn btn-light" href="{{ url_for('auth.list_users') }}">Cancel</a></div>
</form>
</div></div>
{% endblock %}
