{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="form">
  <label>National ID (11 digits)<input name="national_id" maxlength="11" required value="{{ patient.national_id or '' }}"></label>
  <label>Full name<input name="full_name" required value="{{ patient.full_name or '' }}"></label>
  <label>Birth date<input type="date" name="birth_date" required value="{{ patient.birth_date or '' }}"></label>
  <label>Phone<input name="phone" value="{{ patient.phone or '' }}"></label>
  <label>Email<input type="email" name="email" value="{{ patient.email or '' }}"></label>
  <div><button class="btn">Save</button> <a href="{{ url_for('patients.list_patients') }}">Cancel</a></div>
</form>
{% endblock %}
