<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Clinic Appointment System logo">
  <title>Clinic Appointment System</title>
  <defs>
    <linearGradient id="cas-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <!-- calendar body -->
  <rect x="4" y="8" width="56" height="52" rx="12" fill="url(#cas-bg)"/>
  <!-- calendar rings -->
  <rect x="17" y="3" width="6" height="12" rx="3" fill="#0B2545"/>
  <rect x="41" y="3" width="6" height="12" rx="3" fill="#0B2545"/>
  <!-- medical cross -->
  <path d="M27 21h10v9h9v10h-9v9H27v-9h-9V30h9z" fill="#FFFFFF"/>
  <!-- confirmation tick -->
  <circle cx="49" cy="49" r="10" fill="#0B2545" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M44.5 49.2l3.2 3.2 6-6.4" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
